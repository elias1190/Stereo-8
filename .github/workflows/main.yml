name: Compilar app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Descomprimir el proyecto
        run: unzip -q StereoElias-proyecto.zip -d proyecto
      - name: Compilar
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StereoElias-app
          path: proyecto/app/build/outputs/apk/debug/*.apk
